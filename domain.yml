version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - ask_admission_soict

actions:
  - action_rag_retrieval

responses:
  utter_greet:
    - text: "Xin chào! Tôi là trợ lý tư vấn tuyển sinh Trường Công nghệ Thông tin và Truyền thông (SoICT) - Đại học Bách khoa Hà Nội. Bạn muốn tìm hiểu về ngành học, phương thức xét tuyển, điểm chuẩn hay học phí?"

  utter_goodbye:
    - text: "Tạm biệt, chúc bạn có lựa chọn đúng đắn!"

  utter_iamabot:
    - text: "Tôi là chatbot AI tư vấn tuyển sinh, được xây dựng bằng Rasa kết hợp tìm kiếm tài liệu (RAG) và Google Gemini."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
