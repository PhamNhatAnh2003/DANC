# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1

assistant_id: soict-admission-chatbot

language: vi

# NLU pipeline cho tiếng Việt: tách từ theo khoảng trắng,
# đặc trưng n-gram ký tự (chịu được viết tắt / thiếu dấu) và DIET để phân loại ý định.
pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper
  # Nếu độ tin cậy < 0.4 thì gán intent nlu_fallback -> chuyển sang RAG
  - name: FallbackClassifier
    threshold: 0.4
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
