version: "3.1"

rules:

- rule: Chào hỏi
  steps:
  - intent: greet
  - action: utter_greet

- rule: Tạm biệt
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Trả lời khi người dùng hỏi có phải bot không
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Hỏi thông tin tuyển sinh thì tra cứu tài liệu (RAG)
  steps:
  - intent: ask_admission_soict
  - action: action_rag_retrieval

- rule: Kích hoạt RAG khi bot không chắc ý định (Fallback)
  steps:
  - intent: nlu_fallback
  - action: action_rag_retrieval
