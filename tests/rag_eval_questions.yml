  - question: Năm 2026 Trường CNTT&TT tuyển bao nhiêu sinh viên?
    expected: ["1060"]
  - question: Chỉ tiêu ngành Khoa học máy tính IT1 năm 2026 là bao nhiêu?
    expected: ["300"]
  - question: Năm 2024 SoICT tuyển bao nhiêu sinh viên?
    expected: ["1020"]
  - question: Chỉ tiêu ngành Khoa học dữ liệu và trí tuệ nhân tạo năm 2026?
    expected: ["160"]

  # --- Điểm chuẩn ---
  - question: Điểm chuẩn ngành Khoa học máy tính năm 2025 theo điểm thi THPT?
    expected: ["29.19"]
  - question: Điểm chuẩn IT2 năm 2024 theo điểm thi tốt nghiệp THPT là bao nhiêu?
    expected: ["28.48"]
  - question: Điểm chuẩn đánh giá tư duy ngành IT-E10 năm 2025?
    expected: ["86.97"]
  - question: Năm 2023 điểm chuẩn TSA ngành Khoa học máy tính bao nhiêu?
    expected: ["83.9"]
  - question: Điểm chuẩn ngành An toàn không gian số năm 2026 theo điểm THPT?
    expected: ["29.01"]
  - question: Ngành nào có điểm chuẩn cao nhất Bách khoa năm 2026?
