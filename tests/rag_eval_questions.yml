  - question: Chương trình HEDSPI IT-E6 tăng cường ngoại ngữ gì?
    expected: ["Nhật"]
  - question: Những chương trình nào của SoICT học bằng tiếng Anh?
    expected: ["IT-E7", "IT-E10", "IT-E15"]
  - question: Khác nhau giữa Khoa học máy tính và Kỹ thuật máy tính?
