  - question: Điểm chuẩn xét tuyển tài năng ngành Khoa học máy tính năm 2025?
    expected: ["93.92"]

  # --- Phương thức, tổ hợp ---
  - question: Trường có những phương thức tuyển sinh nào?
    expected: ["tài năng", "tư duy", "THPT"]
  - question: Tổ hợp xét tuyển ngành IT1 năm 2026 gồm những tổ hợp nào?
