# Bộ câu hỏi đánh giá RAG. Chạy: python scripts/evaluate_rag.py
# expected: các chuỗi PHẢI xuất hiện (không phân biệt hoa thường) trong đoạn tài liệu tìm được / câu trả lời.
# Khi sửa số liệu trong docs/admission, nhớ sửa expected tương ứng.

questions:
