  # --- Học phí, học bổng ---
  - question: Học phí ngành Khoa học dữ liệu và trí tuệ nhân tạo năm 2026?
    expected: ["64-67"]
  - question: Học phí chương trình chuẩn năm học 2025-2026 bao nhiêu?
