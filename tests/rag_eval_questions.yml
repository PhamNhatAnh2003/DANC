  - question: IELTS 5.0 được quy đổi thành bao nhiêu điểm năm 2026?
    expected: ["8 điểm"]
  - question: Đăng ký thi đánh giá tư duy ở đâu?
    expected: ["tsa.hust.edu.vn"]
  - question: Công thức tính điểm tổ hợp K01?
