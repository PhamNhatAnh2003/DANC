# Chạy: rasa test
# Kiểm tra bot nhận đúng ý định và gọi đúng hành động.

stories:
- story: chào hỏi
  steps:
  - user: |
      xin chào
    intent: greet
  - action: utter_greet

- story: hỏi tuyển sinh rồi tạm biệt
  steps:
  - user: |
      chào bạn
    intent: greet
  - action: utter_greet
  - user: |
      học phí ngành khoa học máy tính bao nhiêu
    intent: ask_admission_soict
  - action: action_rag_retrieval
  - user: |
      cảm ơn, tạm biệt
    intent: goodbye
  - action: utter_goodbye

- story: hỏi nhiều câu tuyển sinh
  steps:
  - user: |
      soict có những ngành nào
    intent: ask_admission_soict
  - action: action_rag_retrieval
  - user: |
      điểm chuẩn ngành kỹ thuật máy tính năm ngoái
    intent: ask_admission_soict
  - action: action_rag_retrieval

- story: hỏi phương thức xét tuyển
  steps:
  - user: |
      trường xét tuyển bằng những phương thức nào
    intent: ask_admission_soict
  - action: action_rag_retrieval

- story: hỏi có phải bot
  steps:
  - user: |
      bạn có phải người thật không
    intent: bot_challenge
  - action: utter_iamabot

- story: tạm biệt
  steps:
  - user: |
      bye
    intent: goodbye
  - action: utter_goodbye
